<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html,body{height:100%;width:100%;margin:0;overflow:hidden;background:#171a21}
    body{display:flex;flex-direction:column}
    #editor{flex:1;min-height:0;width:100%;background:#171a21}
    *{box-sizing:border-box}
    #debugger-panel{display:none;height:235px;min-height:170px;background:#10151d;color:#dbe3f2;border-top:1px solid #303a4b;font:12px Segoe UI,Arial,sans-serif}
    #debugger-toolbar{height:38px;display:flex;align-items:center;gap:6px;padding:4px 8px;background:#1b2230}
    #debugger-toolbar button{background:#283449;border:1px solid #3c4b66;color:#edf2fa;padding:5px 10px;border-radius:4px;cursor:pointer}
    #debugger-toolbar button:hover{background:#394966}
    #debugger-status{margin-left:auto;color:#a9b9d5}
    #debugger-content{height:calc(100% - 38px);display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:#2d394a}
    .debug-section{background:#121923;overflow:auto;padding:7px 9px}
    .debug-section h4{margin:0 0 6px;color:#9eafd0;font-size:10px;letter-spacing:.08em}
    .debug-section ul{padding:0;margin:0;list-style:none}
    .debug-section li{padding:3px 2px;border-bottom:1px solid #202a38;cursor:pointer;white-space:pre-wrap;overflow-wrap:anywhere}
    .debug-section li:hover{background:#263449}
    #debug-output{white-space:pre-wrap;overflow-wrap:anywhere;color:#c3d0e5}
    .studio-breakpoint-glyph{background:#e34d59;border-radius:50%;width:9px!important;height:9px!important;margin-left:5px}
    .studio-current-line{background:rgba(87,134,232,.17);border-left:2px solid #83a8ff}
    
  </style>
  <script src="./monaco/vs/loader.js"></script>
</head>
<body>
<div id="editor"></div>
<div id="debugger-panel">
  <div id="debugger-toolbar">
    <button id="dap-continue">Continue</button><button id="dap-pause">Pause</button>
    <button id="dap-next">Step Over</button><button id="dap-stepin">Step In</button>
    <button id="dap-stepout">Step Out</button><button id="dap-stop">Stop</button>
    <span id="debugger-status">Debugger idle · click the gutter to toggle breakpoints</span>
  </div>
  <div id="debugger-content">
    <div class="debug-section"><h4>CALL STACK</h4><ul id="debug-stack"></ul></div>
    <div class="debug-section"><h4>VARIABLES</h4><ul id="debug-variables"></ul></div>
    <div class="debug-section"><h4>DEBUG CONSOLE</h4><div id="debug-output"></div></div>
  </div>
</div>
<script>
require.config({paths:{vs:"./monaco/vs"}});
require(["vs/editor/editor.main"],function(){
  const editor=monaco.editor.create(document.getElementById("editor"),{
    value:"// Welcome to Studio.exe\n// Open a file and start creating.",
    language:"javascript",theme:"vs-dark",automaticLayout:true,minimap:{enabled:true},
    fontSize:14,wordWrap:"on",tabSize:4,scrollBeyondLastLine:false,glyphMargin:true,
    smoothScrolling:true,mouseWheelZoom:true,quickSuggestions:{other:true,comments:false,strings:false},
    suggestOnTriggerCharacters:true,formatOnPaste:true,formatOnType:true
  });
  let settingValue=false;
  window.editor=editor;
  let currentDocumentUri="untitled:studio-new-file", currentLanguage="javascript", documentVersion=1;
  window.studioSetDocument=function(value,language,uri){
    const nextUri=uri||"untitled:studio-new-file";
    if(lsp.ready && lsp.uri && lsp.uri!==nextUri){
      lspNotify("textDocument/didClose",{textDocument:{uri:lsp.uri}});
    }
    settingValue=true;
    const parsedUri=monaco.Uri.parse(nextUri);
    const model=editor.getModel();
    if(!model || model.uri.toString()!==parsedUri.toString()){
      const nextModel=monaco.editor.createModel(value,language||"plaintext",parsedUri);
      editor.setModel(nextModel);
      if(model) model.dispose();
    }else{
      model.setValue(value);
      monaco.editor.setModelLanguage(model,language||"plaintext");
    }
    currentDocumentUri=nextUri; currentLanguage=language||"plaintext"; documentVersion++;
    if(lsp.ready && lsp.uri!==nextUri){
      lsp.uri=nextUri;
      lspNotify("textDocument/didOpen",{textDocument:{uri:nextUri,languageId:currentLanguage,version:documentVersion,text:value}});
    }else if(lsp.ready){
      lsp.uri=nextUri;
      lspNotify("textDocument/didChange",{textDocument:{uri:nextUri,version:documentVersion},contentChanges:[{text:value}]});
    }
    setTimeout(()=>{settingValue=false;},0);
  };
  window.studioSetValue=window.studioSetDocument;
  window.studioSetDiagnostics=function(items){
    const model=editor.getModel(); if(!model)return;
    const markers=(items||[]).map(d=>({
      startLineNumber:Math.max(1,d.line||1),startColumn:Math.max(1,d.column||1),
      endLineNumber:Math.max(1,d.line||1),endColumn:Math.max(2,(d.column||1)+1),
      message:d.message||"Diagnostic",
      severity:d.severity==="Warning"?monaco.MarkerSeverity.Warning:monaco.MarkerSeverity.Error,
      source:"Studio.exe"
    }));
    monaco.editor.setModelMarkers(model,"studio-diagnostics",markers);
  };
  editor.onDidChangeModelContent(()=>{
    if(!settingValue){
      const text=editor.getValue();
      window.chrome.webview.postMessage({type:"text",text});
      if(lsp.ready && lsp.uri){
        documentVersion++;
        lspNotify("textDocument/didChange",{textDocument:{uri:lsp.uri,version:documentVersion},contentChanges:[{text}]});
      }
    }
  });

  const lsp={ready:false,language:null,uri:null,seq:10,pending:new Map(),rootUri:null};
  function sendHost(type,payload){window.chrome.webview.postMessage({type,payload});}
  function lspRequest(method,params){
    if(!lsp.ready && method!=="initialize") return Promise.resolve(null);
    const id=lsp.seq++;
    return new Promise(resolve=>{
      const timer=setTimeout(()=>{lsp.pending.delete(id);resolve(null);},3500);
      lsp.pending.set(id,{resolve,timer,method});
      sendHost("lsp",{jsonrpc:"2.0",id,method,params});
    });
  }
  function lspNotify(method,params){if(lsp.uri || method==="initialized") sendHost("lsp",{jsonrpc:"2.0",method,params});}
  function lspPosition(position){return {line:position.lineNumber-1,character:position.column-1};}
  function lspRange(range){
    if(!range)return null;
    return new monaco.Range(range.start.line+1,range.start.character+1,range.end.line+1,range.end.character+1);
  }
  function lspMarkup(value){
    if(!value)return "";
    if(typeof value==="string")return value;
    if(Array.isArray(value))return value.map(x=>x.value||x.language||"").join("\\n");
    return value.value||"";
  }
  function lspCompletion(result,position){
    if(!result)return null;
    const list=Array.isArray(result)?result:(result.items||[]);
    const word=editor.getModel().getWordUntilPosition(position);
    const fallbackRange={startLineNumber:position.lineNumber,startColumn:word.startColumn,endLineNumber:position.lineNumber,endColumn:word.endColumn};
    const kindMap={1:K.Text,2:K.Method,3:K.Function,4:K.Constructor,5:K.Field,6:K.Variable,7:K.Class,8:K.Interface,9:K.Module,10:K.Property,11:K.Unit,12:K.Value,13:K.Enum,14:K.Keyword,15:K.Snippet,16:K.Color,17:K.File,18:K.Reference,19:K.Folder,20:K.EnumMember,21:K.Constant,22:K.Struct,23:K.Event,24:K.Operator,25:K.TypeParameter};
    return {isIncomplete:!!result.isIncomplete,suggestions:list.map(item=>({
      label:item.label,kind:kindMap[item.kind]||K.Text,detail:item.detail,
      documentation:lspMarkup(item.documentation),sortText:item.sortText,filterText:item.filterText,
      insertText:item.insertText||item.label,
      insertTextRules:item.insertTextFormat===2?R.InsertAsSnippet:undefined,
      range:item.textEdit&&item.textEdit.range?lspRange(item.textEdit.range):fallbackRange
    }))};
  }
  window.studioConnectLsp=async function(config){
    lsp.ready=false;lsp.language=config.language;lsp.uri=config.uri;lsp.rootUri=config.rootUri;
    const result=await lspRequest("initialize",{
      processId:null,clientInfo:{name:"Studio.exe",version:"1.0.0"},rootUri:config.rootUri,
      workspaceFolders:[{uri:config.rootUri,name:"Studio"}],
      capabilities:{
        textDocument:{
          completion:{completionItem:{snippetSupport:true,documentationFormat:["markdown","plaintext"],tagSupport:{valueSet:[1]}}},
          hover:{contentFormat:["markdown","plaintext"]},definition:{linkSupport:true},
          signatureHelp:{signatureInformation:{documentationFormat:["markdown","plaintext"],parameterInformation:{labelOffsetSupport:true}}},
          documentSymbol:{hierarchicalDocumentSymbolSupport:true},publishDiagnostics:{relatedInformation:true,versionSupport:true},
          synchronization:{dynamicRegistration:false,didSave:true}
        },workspace:{workspaceFolders:true,configuration:true}
      }
    });
    if(!result){window.chrome.webview.postMessage({type:"editorStatus",text:"Language server did not answer initialize."});return;}
    lsp.ready=true;
    lspNotify("initialized",{});
    lspNotify("textDocument/didOpen",{textDocument:{uri:lsp.uri,languageId:lsp.language,version:documentVersion,text:editor.getValue()}});
    window.chrome.webview.postMessage({type:"editorStatus",text:(lsp.language==="python"?"Pyright":"C# Roslyn")+" language server connected"});
  };
  window.studioDisconnectLsp=function(){
    if(lsp.ready && lsp.uri) lspNotify("textDocument/didClose",{textDocument:{uri:lsp.uri}});
    lsp.ready=false;lsp.uri=null;lsp.language=null;lsp.pending.forEach(x=>{clearTimeout(x.timer);x.resolve(null);});lsp.pending.clear();
  };
  window.chrome.webview.addEventListener("message",event=>{
    const packet=event.data;if(!packet||typeof packet!=="object")return;
    if(packet.type==="lspMessage"){
      const message=packet.payload;
      if(message.id!==undefined && lsp.pending.has(message.id)){
        const pending=lsp.pending.get(message.id);lsp.pending.delete(message.id);clearTimeout(pending.timer);pending.resolve(message.result||null);
      }
      if(message.method==="textDocument/publishDiagnostics"){
        const diagnostics=message.params.diagnostics||[];
        const markers=diagnostics.map(d=>({
          startLineNumber:d.range.start.line+1,startColumn:d.range.start.character+1,
          endLineNumber:d.range.end.line+1,endColumn:Math.max(d.range.start.character+2,d.range.end.character+1),
          message:d.message,source:d.source||"Language Server",
          severity:d.severity===1?monaco.MarkerSeverity.Error:d.severity===2?monaco.MarkerSeverity.Warning:d.severity===3?monaco.MarkerSeverity.Info:monaco.MarkerSeverity.Hint
        }));
        if(message.params.uri===lsp.uri)monaco.editor.setModelMarkers(editor.getModel(),"language-server",markers);
      }
    }else if(packet.type==="dapMessage") dapHandle(packet.payload);
  });

  const K=monaco.languages.CompletionItemKind;
  const R=monaco.languages.CompletionItemInsertTextRule;
  const pyKeywords=("False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield").split(" ");
  const pyBuiltins={
    print:"print(*objects, sep=' ', end='\\n') — write values to standard output",
    len:"len(obj) — return the number of items in an object",
    range:"range(start, stop, step) — generate an arithmetic sequence",
    enumerate:"enumerate(iterable, start=0) — yield index/value pairs",
    zip:"zip(*iterables) — iterate over items in parallel",
    map:"map(function, iterable) — apply a function to each item",
    filter:"filter(function, iterable) — select matching items",
    sorted:"sorted(iterable, key=None, reverse=False) — return a sorted list",
    isinstance:"isinstance(object, classinfo) — test an object's type",
    issubclass:"issubclass(class, classinfo) — test class inheritance",
    super:"super() — access the parent implementation",
    property:"property(fget, fset, fdel, doc) — managed attribute",
    setattr:"setattr(object, name, value) — set a named attribute",
    getattr:"getattr(object, name[, default]) — read a named attribute",
    hasattr:"hasattr(object, name) — test for an attribute",
    open:"open(file, mode='r', encoding=None) — open a file",
    json:"json — JSON encoder and decoder module",
    Path:"pathlib.Path — object-oriented filesystem paths",
    dataclass:"dataclasses.dataclass — generate data-class methods",
    Optional:"typing.Optional — optional type annotation",
    List:"typing.List — typed list annotation",
    Dict:"typing.Dict — typed dictionary annotation",
    Any:"typing.Any — unconstrained typing value",
    "asyncio.run":"asyncio.run(coro) — run an async coroutine",
    "requests.get":"requests.get(url, params=None, **kwargs) — send HTTP GET",
    "requests.post":"requests.post(url, data=None, json=None, **kwargs) — send HTTP POST"
  };
  const pyModules=("abc argparse array asyncio base64 bisect collections concurrent.futures contextlib copy csv dataclasses datetime decimal difflib enum functools fnmatch fractions glob hashlib heapq hmac html http importlib inspect io itertools json logging math multiprocessing os pathlib pickle platform pprint queue random re secrets shutil signal socket sqlite3 statistics string subprocess sys tempfile textwrap threading time traceback types typing unittest urllib uuid venv warnings zipfile").split(" ");
  const csKeywords=("abstract as async await base bool break byte case catch char checked class const continue decimal default delegate do double else enum event explicit extern false finally fixed float for foreach goto if implicit in int interface internal is lock long namespace new null object operator out override params private protected public readonly ref return sbyte sealed short sizeof stackalloc static string struct switch this throw true try typeof uint ulong unchecked unsafe ushort using var virtual void volatile while").split(" ");
  const csTypes=("Action Array ArrayList ArgumentException ArgumentNullException ArgumentOutOfRangeException AsyncLocal Attribute BinaryReader BinaryWriter CancellationToken CancellationTokenSource CharComparer Collection Comparer Console DateOnly DateTime DateTimeOffset Dictionary Directory DirectoryInfo Enum Environment Exception File FileInfo FileStream Func Guid HashSet HttpClient ICollection IEnumerable IEnumerator IList ILookup Index KeyNotFoundException List Math MemoryStream Nullable Object Path Random ReadOnlyCollection Regex SemaphoreSlim Span String StringBuilder Stream StreamReader StreamWriter Task TaskCompletionSource TimeSpan Tuple Uri ValueTask Version Stopwatch").split(" ");
  const csDocs={
    "Console.WriteLine":"Writes the specified data followed by the current line terminator.",
    "Console.ReadLine":"Reads the next line of characters from the standard input stream.",
    "Enumerable.Where":"Filters a sequence of values based on a predicate.",
    "Enumerable.Select":"Projects each element of a sequence into a new form.",
    "Task.Run":"Queues the specified work to run on the ThreadPool.",
    "File.ReadAllText":"Opens a text file, reads all text, and closes the file.",
    "Path.Combine":"Combines strings into a path.",
    "StringBuilder.Append":"Appends information to the end of the current StringBuilder."
  };
  const suggestions=(items,range)=>items.map(x=>typeof x==="string"
    ? {label:x,kind:K.Keyword,insertText:x,range,sortText:"2"+x}
    : {...x,range});
  function currentWord(model,position){
    return model.getWordUntilPosition(position);
  }
  function localNames(model,language){
    const text=model.getValue(),items=[];
    const patterns=language==="python"
      ? [/^\s*def\s+([A-Za-z_]\w*)/gm,/^\s*class\s+([A-Za-z_]\w*)/gm,/^\s*([A-Za-z_]\w*)\s*=/gm,/^\s*import\s+([A-Za-z_]\w*)/gm,/^\s*from\s+[\w.]+\s+import\s+([A-Za-z_]\w*)/gm]
      : [/\b(?:class|struct|interface|enum|record|namespace)\s+([A-Za-z_]\w*)/g,/\b(?:void|int|string|bool|double|float|var|decimal|Task|object|long|DateTime)\s+([A-Za-z_]\w*)\s*(?=[=(;,{])/g,/\b(?:public|private|protected|internal)\s+(?:static\s+)?[\w<>\[\],.?]+\s+([A-Za-z_]\w*)\s*(?=[=(;])/g];
    for(const re of patterns){let m;while((m=re.exec(text))!==null){if(!items.includes(m[1]))items.push(m[1]);}}
    return items;
  }
  monaco.languages.registerCompletionItemProvider("python",{
    triggerCharacters:[".","@"],
    async provideCompletionItems(model,position){
        if(lsp.ready && lsp.uri){
          const remote=await lspRequest("textDocument/completion",{textDocument:{uri:lsp.uri},position:lspPosition(position)});
          if(remote)return lspCompletion(remote,position);
        }
      const word=currentWord(model,position),range={startLineNumber:position.lineNumber,startColumn:word.startColumn,endLineNumber:position.lineNumber,endColumn:word.endColumn};
      const line=model.getLineContent(position.lineNumber),before=line.slice(0,position.column-1);
      let names=[];
      if(/\bimport\s+[\w.]*$/.test(before)||/\bfrom\s+[\w.]*$/.test(before)){
        names=pyModules.map(x=>({label:x,kind:K.Module,detail:"Python standard library module"}));
      }else if(/\b(?:self|cls)\.[\w]*$/.test(before)){
        names=localNames(model,"python").map(x=>({label:x,kind:K.Field,detail:"Symbol in this file"}));
      }else{
        names=[...pyKeywords.map(x=>({label:x,kind:K.Keyword})),
          ...Object.keys(pyBuiltins).map(x=>({label:x,kind:K.Function,detail:pyBuiltins[x],documentation:{value:pyBuiltins[x]}})),
          ...pyModules.map(x=>({label:x,kind:K.Module,detail:"Standard library"})),
          ...localNames(model,"python").map(x=>({label:x,kind:K.Variable,detail:"Defined in current file"})),
          {label:"if __name__ == '__main__':",kind:K.Snippet,insertText:"if __name__ == \"__main__\":\n\t$0",insertTextRules:R.InsertAsSnippet},
          {label:"class with initializer",kind:K.Snippet,insertText:"class ${1:Name}:\n\tdef __init__(self, ${2:value}):\n\t\tself.${2:value} = ${2:value}\n\t\t$0",insertTextRules:R.InsertAsSnippet},
          {label:"async function",kind:K.Snippet,insertText:"async def ${1:name}(${2:args}):\n\t$0",insertTextRules:R.InsertAsSnippet},
          {label:"try / except",kind:K.Snippet,insertText:"try:\n\t$1\nexcept ${2:Exception} as ${3:error}:\n\t$0",insertTextRules:R.InsertAsSnippet}];
      }
      const unique=new Map(names.map(x=>[x.label,x]));
      return {suggestions:suggestions([...unique.values()],range)};
    }
  });
  monaco.languages.registerCompletionItemProvider("csharp",{
    triggerCharacters:[".","<",":"],
    provideCompletionItems(model,position){
      const word=currentWord(model,position),range={startLineNumber:position.lineNumber,startColumn:word.startColumn,endLineNumber:position.lineNumber,endColumn:word.endColumn};
      const before=model.getLineContent(position.lineNumber).slice(0,position.column-1);
      let names=[];
      if(/\bConsole\.[\w]*$/.test(before)) names=["WriteLine","Write","ReadLine","ReadKey","Error","Out","In"].map(x=>({label:x,kind:K.Method,detail:"System.Console"}));
      else if(/\bMath\.[\w]*$/.test(before)) names=["Abs","Ceiling","Floor","Max","Min","Pow","Round","Sqrt","Sin","Cos","PI","E"].map(x=>({label:x,kind:K.Method,detail:"System.Math"}));
      else if(/\b(?:File|Directory|Path)\.[\w]*$/.test(before)) names=["Exists","ReadAllText","ReadAllLines","WriteAllText","Create","Delete","Combine","GetExtension","GetFileName","GetDirectoryName","EnumerateFiles","EnumerateDirectories"].map(x=>({label:x,kind:K.Method,detail:"System.IO"}));
      else names=[
        ...csKeywords.map(x=>({label:x,kind:K.Keyword})),
        ...csTypes.map(x=>({label:x,kind:K.Class,detail:"System / .NET API"})),
        ...localNames(model,"csharp").map(x=>({label:x,kind:K.Variable,detail:"Defined in current file"})),
        {label:"async Task method",kind:K.Snippet,insertText:"public async Task ${1:MethodName}(${2:})\n{\n    $0\n}",insertTextRules:R.InsertAsSnippet},
        {label:"property",kind:K.Snippet,insertText:"public ${1:string} ${2:Name} { get; set; }",insertTextRules:R.InsertAsSnippet},
        {label:"constructor",kind:K.Snippet,insertText:"public ${1:ClassName}(${2:})\n{\n    $0\n}",insertTextRules:R.InsertAsSnippet},
        {label:"foreach",kind:K.Snippet,insertText:"foreach (var ${1:item} in ${2:collection})\n{\n    $0\n}",insertTextRules:R.InsertAsSnippet},
        {label:"try / catch",kind:K.Snippet,insertText:"try\n{\n    $1\n}\ncatch (Exception ${2:ex})\n{\n    $0\n}",insertTextRules:R.InsertAsSnippet},
        {label:"LINQ query",kind:K.Snippet,insertText:"var ${1:result} = ${2:items}.Where(x => ${3:condition}).Select(x => ${4:x});$0",insertTextRules:R.InsertAsSnippet}
      ];
      const unique=new Map(names.map(x=>[x.label,x]));
      return {suggestions:suggestions([...unique.values()],range)};
    }
  });

  const signatures={
    print:"print(*objects, sep=' ', end='\\n')",
    len:"len(obj)",
    range:"range(start, stop=None, step=1)",
    enumerate:"enumerate(iterable, start=0)",
    sorted:"sorted(iterable, *, key=None, reverse=False)",
    open:"open(file, mode='r', buffering=-1, encoding=None)",
    "Console.WriteLine":"WriteLine(string? value)",
    "Console.ReadLine":"ReadLine()",
    "Math.Round":"Round(double value, int digits)",
    "File.ReadAllText":"ReadAllText(string path, Encoding? encoding = null)",
    "Enumerable.Where":"Where<TSource>(IEnumerable<TSource>, Func<TSource,bool>)",
    "Enumerable.Select":"Select<TSource,TResult>(IEnumerable<TSource>, Func<TSource,TResult>)",
    "Task.Run":"Run(Func<Task> function)"
  };
  const docs={...pyBuiltins,...csDocs};
  function wordAt(model,pos){
    const w=model.getWordAtPosition(pos);return w?w.word:"";
  }
  for(const language of ["python","csharp"]){
    monaco.languages.registerHoverProvider(language,{
      async provideHover(model,position){
        if(lsp.ready && lsp.uri){
          const remote=await lspRequest("textDocument/hover",{textDocument:{uri:lsp.uri},position:lspPosition(position)});
          if(remote&&remote.contents)return {contents:[{value:lspMarkup(remote.contents)}],range:lspRange(remote.range)||undefined};
        }
        const word=wordAt(model,position);
        const line=model.getLineContent(position.lineNumber);
        const qualified=(line.slice(0,position.column-1).match(/[A-Za-z_]\w*\.$/)||[])[0]||"";
        const key=qualified+word;
        const value=docs[key]||docs[word];
        if(!value)return null;
        return {contents:[{value:"**"+key+"**"},{value} ]};
      }
    });
    monaco.languages.registerSignatureHelpProvider(language,{
      signatureHelpTriggerCharacters:["(",",","="],
      async provideSignatureHelp(model,position){
        if(lsp.ready && lsp.uri){
          const remote=await lspRequest("textDocument/signatureHelp",{textDocument:{uri:lsp.uri},position:lspPosition(position)});
          if(remote)return {value:remote,dispose(){}};
        }
        const prefix=model.getValueInRange({startLineNumber:Math.max(1,position.lineNumber-2),startColumn:1,endLineNumber:position.lineNumber,endColumn:position.column});
        const match=prefix.match(/([A-Za-z_]\w*(?:\.[A-Za-z_]\w*)*)\s*\([^()]*$/);
        if(!match)return {value:{signatures:[],activeSignature:0,activeParameter:0},dispose(){}};
        const sig=signatures[match[1]];
        if(!sig)return {value:{signatures:[],activeSignature:0,activeParameter:0},dispose(){}};
        const args=(prefix.slice(prefix.lastIndexOf("(")+1).match(/,/g)||[]).length;
        return {value:{signatures:[{label:sig,documentation:docs[match[1]]||"",parameters:sig.slice(sig.indexOf("(")+1,-1).split(",").map(x=>({label:x.trim()}))}],activeSignature:0,activeParameter:args},dispose(){}};
      }
    });
    monaco.languages.registerDocumentSymbolProvider(language,{
      async provideDocumentSymbols(model){
        if(lsp.ready && lsp.uri){
          const remote=await lspRequest("textDocument/documentSymbol",{textDocument:{uri:lsp.uri}});
          if(remote&&remote.length)return remote.map(s=>({
            name:s.name,detail:s.detail||"",kind:s.kind||K.Function,
            range:lspRange(s.range||s.location&&s.location.range)||new monaco.Range(1,1,1,1),
            selectionRange:lspRange(s.selectionRange||s.location&&s.location.range)||new monaco.Range(1,1,1,1),
            children:s.children
          }));
        }
        const symbols=[],text=model.getValue(),re=language==="python"?/^\s*(async\s+)?(def|class)\s+([A-Za-z_]\w*)/gm:/\b(class|struct|interface|enum|record|namespace|void|int|string|bool|Task)\s+([A-Za-z_]\w*)\s*(?=[({])/g;
        let m;while((m=re.exec(text))!==null){
          const line=model.getPositionAt(m.index).lineNumber;
          const kind=(m[2]||m[1]).toLowerCase();
          symbols.push({name:m[3]||m[2],detail:kind,kind:kind.includes("class")?K.Class:kind.includes("namespace")?K.Module:K.Function,range:new monaco.Range(line,1,line,model.getLineMaxColumn(line)),selectionRange:new monaco.Range(line,1,line,model.getLineMaxColumn(line))});
        }
        return symbols;
      }
    });
    monaco.languages.registerDefinitionProvider(language,{
      async provideDefinition(model,position){
        if(lsp.ready && lsp.uri){
          const remote=await lspRequest("textDocument/definition",{textDocument:{uri:lsp.uri},position:lspPosition(position)});
          const location=Array.isArray(remote)?remote[0]:remote;
          if(location&&location.range)return {uri:monaco.Uri.parse(location.uri||lsp.uri),range:lspRange(location.range)};
          if(location&&location.targetSelectionRange)return {uri:monaco.Uri.parse(location.targetUri),range:lspRange(location.targetSelectionRange)};
        }
        const name=wordAt(model,position);if(!name)return null;
        const text=model.getValue(),patterns=language==="python"?[/^\s*def\s+NAME\b/m,/^\s*class\s+NAME\b/m,/^\s*NAME\s*=/m]:[/\b(?:class|struct|interface|enum|record|namespace)\s+NAME\b/,/\b(?:void|int|string|bool|var|Task|double)\s+NAME\s*(?=[=(;])/];
        for(const template of patterns){
          const re=new RegExp(template.source.replace("NAME",name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")),"m");
          const m=re.exec(text);if(m){const p=model.getPositionAt(m.index+m[0].indexOf(name));return {uri:model.uri,range:new monaco.Range(p.lineNumber,p.column,p.lineNumber,p.column+name.length)};}
        }
        return null;
      }
    });
  }
  const dap={seq:1,pending:new Map(),target:null,threadId:1,frameId:null,ready:false,configured:false,breakpoints:new Set(),lineDecoration:[]};
  const byId=id=>document.getElementById(id);
  function setDebugStatus(text){byId("debugger-status").textContent=text;}
  function debugOutput(text){const node=byId("debug-output");node.textContent+=text;if(!text.endsWith("\\n"))node.textContent+="\\n";node.scrollTop=node.scrollHeight;}
  function dapRequest(command,args={}){
    const seq=dap.seq++;
    return new Promise(resolve=>{
      const timer=setTimeout(()=>{dap.pending.delete(seq);resolve(null);},10000);
      dap.pending.set(seq,{resolve,timer,command});
      sendHost("dap",{seq,type:"request",command,arguments:args});
    });
  }
  function setBreakpoints(){
    if(!dap.ready||!dap.target)return;
    const lines=[...dap.breakpoints].sort((a,b)=>a-b).map(line=>({line,verified:false}));
    dapRequest("setBreakpoints",{source:{name:dap.target.program.split(/[\\/]/).pop(),path:dap.target.program},breakpoints:lines,sourceModified:false})
      .then(result=>{if(result&&result.breakpoints)result.breakpoints.forEach((bp,i)=>{if(bp.verified)setDebugStatus("Breakpoint verified · line "+lines[i].line);});});
  }
  function toggleBreakpoint(line){
    if(dap.breakpoints.has(line))dap.breakpoints.delete(line);else dap.breakpoints.add(line);
    if(dap.breakpoints.has(line))debugOutput("Breakpoint added at line "+line);else debugOutput("Breakpoint removed at line "+line);
    renderBreakpoints();setBreakpoints();
  }
  function renderBreakpoints(){
    const decorations=[...dap.breakpoints].map(line=>({range:new monaco.Range(line,1,line,1),options:{glyphMarginClassName:"studio-breakpoint-glyph",glyphMarginHoverMessage:{value:"Breakpoint · line "+line}}}));
    dap.lineDecoration=editor.deltaDecorations(dap.lineDecoration.filter(()=>false),decorations);
  }
  editor.onMouseDown(event=>{
    if(!event.target||!event.target.position)return;
    if(event.target.type===monaco.editor.MouseTargetType.GUTTER_GLYPH_MARGIN||event.target.type===monaco.editor.MouseTargetType.GUTTER_LINE_NUMBERS)
      toggleBreakpoint(event.target.position.lineNumber);
  });
  function renderList(id,items,click){
    const list=byId(id);list.innerHTML="";
    for(const item of items){const li=document.createElement("li");li.textContent=item.label||item.name||String(item.value||"");if(item.title)li.title=item.title;if(click)li.addEventListener("click",()=>click(item));list.appendChild(li);}
  }
  async function refreshStack(){
    const result=await dapRequest("stackTrace",{threadId:dap.threadId,startFrame:0,levels:30});
    const frames=result&&result.stackFrames||[];
    renderList("debug-stack",frames.map(frame=>({label:frame.name+"  ·  "+(frame.source&&frame.source.name||"") + ":" + frame.line,title:frame.id})),frame=>{
      dap.frameId=frame.title;editor.revealLineInCenter(Number(frame.label.match(/:(\\d+)$/)?.[1]||1));
      editor.setPosition({lineNumber:Number(frame.label.match(/:(\\d+)$/)?.[1]||1),column:1});refreshVariables();
    });
    if(frames.length){dap.frameId=frames[0].id;editor.revealLineInCenter(frames[0].line);editor.setPosition({lineNumber:frames[0].line,column:1});await refreshVariables();}
  }
  async function refreshVariables(){
    if(dap.frameId===null)return;
    const scopes=await dapRequest("scopes",{frameId:dap.frameId});
    const rows=[];
    for(const scope of scopes&&scopes.scopes||[]){
      rows.push({label:"▸ "+scope.name});
      const vars=await dapRequest("variables",{variablesReference:scope.variablesReference});
      for(const item of vars&&vars.variables||[])rows.push({label:"  "+item.name+" = "+item.value,title:item.type||""});
    }
    renderList("debug-variables",rows);
  }
  function dapHandle(message){
    if(!message)return;
    if(message.type==="response"&&dap.pending.has(message.request_seq)){
      const p=dap.pending.get(message.request_seq);dap.pending.delete(message.request_seq);clearTimeout(p.timer);
      if(!message.success)debugOutput("DAP "+p.command+" failed: "+(message.message||"unknown error"));
      p.resolve(message.success?message.body||{}:null);
    }else if(message.type==="event"){
      if(message.event==="initialized"){
        dap.ready=true;setBreakpoints();
        dapRequest("setExceptionBreakpoints",{filters:["uncaught","raised"]}).then(()=>dapRequest("configurationDone",{}));
        setDebugStatus("Python debugger initialized · breakpoints enabled");
      }else if(message.event==="stopped"){
        dap.threadId=message.body.threadId||dap.threadId;setDebugStatus("Paused · "+(message.body.reason||"breakpoint"));
        refreshStack();
      }else if(message.event==="continued"){setDebugStatus("Running…");}
      else if(message.event==="output"){debugOutput(message.body.output||"");}
      else if(message.event==="terminated"||message.event==="exited"){setDebugStatus("Debug session ended");dap.ready=false;}
      else if(message.event==="breakpoint"){debugOutput("Breakpoint event: "+JSON.stringify(message.body));}
      else if(message.event==="thread"){dap.threadId=message.body.threadId||dap.threadId;}
    }
  }
  window.studioStartDap=async function(target){
    dap.target=target;dap.ready=false;dap.configured=false;dap.pending.forEach(p=>{clearTimeout(p.timer);p.resolve(null);});dap.pending.clear();
    dap.breakpoints.clear();dap.frameId=null;byId("debugger-panel").style.display="block";setDebugStatus("Connecting to debugpy…");
    byId("debug-stack").innerHTML="";byId("debug-variables").innerHTML="";byId("debug-output").textContent="";
    renderBreakpoints();
    const initialized=await dapRequest("initialize",{
      clientID:"studio-exe",clientName:"Studio.exe",adapterID:"python",pathFormat:"path",
      linesStartAt1:true,columnsStartAt1:true,supportsVariableType:true,
      supportsRunInTerminalRequest:false,supportsProgressReporting:true
    });
    if(!initialized){setDebugStatus("debugpy did not respond to initialize");return;}
    const launched=await dapRequest("launch",{
      name:"Launch Python",type:"python",request:"launch",program:target.program,cwd:target.cwd,
      python:target.python,console:"internalConsole",justMyCode:true,stopOnEntry:false,
      redirectOutput:true,subProcess:false
    });
    if(!launched)setDebugStatus("Python launch failed · check debug console output");
    else setDebugStatus("Python process launched · set a gutter breakpoint or wait for a stop");
  };
  byId("dap-continue").onclick=()=>dapRequest("continue",{threadId:dap.threadId});
  byId("dap-pause").onclick=()=>dapRequest("pause",{threadId:dap.threadId});
  byId("dap-next").onclick=()=>dapRequest("next",{threadId:dap.threadId});
  byId("dap-stepin").onclick=()=>dapRequest("stepIn",{threadId:dap.threadId});
  byId("dap-stepout").onclick=()=>dapRequest("stepOut",{threadId:dap.threadId});
  byId("dap-stop").onclick=()=>{dapRequest("disconnect",{restart:false,terminateDebuggee:true});dap.ready=false;setDebugStatus("Stop requested");};

  monaco.editor.setTheme("vs-dark");
  window.addEventListener("resize",()=>editor.layout());
  window.chrome.webview.postMessage({type:"editorReady"});
});
</script>
