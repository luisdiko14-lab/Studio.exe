name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release version tag to publish (for example v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string

permissions:
  contents: write

concurrency:
  group: studio-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build Studio.exe and installers (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Install Node.js for bundled Monaco assets
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and vendor Monaco editor
        shell: pwsh
        run: |
          npm install --no-save --no-package-lock monaco-editor@0.52.2
          if ($LASTEXITCODE -ne 0) { throw "Monaco npm install failed with exit code $LASTEXITCODE" }
          node scripts/prepare-monaco.mjs
          if ($LASTEXITCODE -ne 0) { throw "Monaco asset preparation failed with exit code $LASTEXITCODE" }

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Studio.sln

      - name: Build Release
        run: dotnet build Studio.sln --configuration Release --no-restore

      - name: Publish self-contained single-file app
        shell: pwsh
        run: |
          dotnet publish src/Studio.App/Studio.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=embedded --output artifacts/Studio
          if ($LASTEXITCODE -ne 0) { throw "Studio.exe publish failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "artifacts/Studio/Studio.exe")) { throw "Publish completed without artifacts/Studio/Studio.exe" }
          if (-not (Test-Path "artifacts/Studio/Assets/monaco/vs/loader.js")) { throw "Bundled Monaco assets were not published" }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          Compress-Archive -Path "artifacts/Studio/*" -DestinationPath "artifacts/Studio-win-x64.zip" -CompressionLevel Optimal -Force

      - name: Publish GUI setup.exe
        shell: pwsh
        run: |
          dotnet publish installer/Studio.Setup/Studio.Setup.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=embedded --output artifacts/Setup
          if ($LASTEXITCODE -ne 0) { throw "GUI setup.exe publish failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "artifacts/Setup/StudioSetup.exe")) { throw "The GUI installer executable was not produced" }
          Copy-Item "artifacts/Setup/StudioSetup.exe" "artifacts/setup.exe" -Force

      - name: Smoke-test Studio.exe and GUI setup startup
        shell: pwsh
        run: |
          $targets = @(
            @{ Path = (Resolve-Path "artifacts/Studio/Studio.exe").Path; Name = "Studio.exe" },
            @{ Path = (Resolve-Path "artifacts/Setup/StudioSetup.exe").Path; Name = "StudioSetup.exe" }
          )
          foreach ($target in $targets) {
            Write-Host "Launching $($target.Name) startup smoke test..."
            $process = Start-Process -FilePath $target.Path -WorkingDirectory (Split-Path $target.Path) -PassThru
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) {
              throw "$($target.Name) exited during startup smoke test with code $($process.ExitCode)."
            }
            Stop-Process -Id $process.Id -Force
            Write-Host "$($target.Name) remained running for 8 seconds."
          }

      - name: Build setup.msi
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v?(\d+\.\d+\.\d+)(?:[-+].*)?$') { throw "Invalid release tag '$env:RELEASE_TAG'. Use vMAJOR.MINOR.PATCH, for example v1.0.0." }
          $version = $Matches[1]
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\Studio"
          dotnet build installer/Studio.Setup.Msi/Studio.Setup.Msi.wixproj --configuration Release "-p:PublishDir=$publishDir" "-p:ProductVersion=$version"
          if ($LASTEXITCODE -ne 0) { throw "WiX MSI build failed with exit code $LASTEXITCODE" }
          $msi = Get-ChildItem "installer/Studio.Setup.Msi/bin" -Filter "Studio.Setup.msi" -File -Recurse | Select-Object -First 1
          if (-not $msi) { throw "WiX build completed without Studio.Setup.msi" }
          Copy-Item $msi.FullName "artifacts/setup.msi" -Force

      - name: Install-test MSI and launch installed application
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "StudioMsiSmoke"
          $logPath = Join-Path $env:RUNNER_TEMP "StudioMsiInstall.log"
          $msiPath = (Resolve-Path "artifacts/setup.msi").Path
          $arguments = @("/i", $msiPath, "/qn", "/norestart", "INSTALLFOLDER=$installDir", "/L*v", $logPath)
          $install = Start-Process -FilePath "msiexec.exe" -ArgumentList $arguments -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) {
            Get-Content $logPath -Tail 100
            throw "MSI installation failed with exit code $($install.ExitCode)."
          }
          $installedExe = Join-Path $installDir "Studio.exe"
          $monacoLoader = Join-Path $installDir "Assets/monaco/vs/loader.js"
          if (-not (Test-Path $installedExe)) { throw "MSI did not install Studio.exe to $installDir" }
          if (-not (Test-Path $monacoLoader)) { throw "MSI did not install the bundled Monaco assets." }

          Write-Host "Launching Studio.exe from the MSI-installed directory..."
          $app = Start-Process -FilePath $installedExe -WorkingDirectory $installDir -PassThru
          Start-Sleep -Seconds 8
          $app.Refresh()
          if ($app.HasExited) {
            $crashLog = Join-Path $env:LOCALAPPDATA "Luis Apps Inc/Studio.exe/Logs/startup.log"
            if (Test-Path $crashLog) { Get-Content $crashLog -Tail 100 }
            throw "MSI-installed Studio.exe exited during startup with code $($app.ExitCode)."
          }
          Stop-Process -Id $app.Id -Force

          $uninstall = Start-Process -FilePath "msiexec.exe" -ArgumentList @("/x", $msiPath, "/qn", "/norestart") -Wait -PassThru
          if ($uninstall.ExitCode -notin @(0, 3010)) {
            throw "MSI uninstall test failed with exit code $($uninstall.ExitCode)."
          }
          Write-Host "MSI install, installed file verification, app startup, and uninstall tests passed."

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $names = @("Studio.exe", "Studio-win-x64.zip", "setup.exe", "setup.msi")
          $lines = foreach ($name in $names) {
            $path = if ($name -eq "Studio.exe") { "artifacts/Studio/Studio.exe" } else { "artifacts/$name" }
            if (-not (Test-Path $path)) { throw "Missing release asset: $path" }
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $lines | Set-Content "artifacts/SHA256SUMS.txt" -Encoding ascii

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Studio.exe-Windows-x64
          path: |
            artifacts/Studio/Studio.exe
            artifacts/Studio-win-x64.zip
            artifacts/setup.exe
            artifacts/setup.msi
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Studio.exe ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          target_commitish: main
          generate_release_notes: true
          files: |
            artifacts/Studio/Studio.exe
            artifacts/Studio-win-x64.zip
            artifacts/setup.exe
            artifacts/setup.msi
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name, '-') }}
