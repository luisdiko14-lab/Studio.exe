name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build Studio.exe (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Studio.sln

      - name: Build Release
        run: dotnet build Studio.sln --configuration Release --no-restore

      - name: Publish self-contained single-file app
        shell: pwsh
        run: |
          dotnet publish src/Studio.App/Studio.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=embedded --output artifacts/Studio
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "artifacts/Studio/Studio.exe")) { throw "Publish completed without artifacts/Studio/Studio.exe" }

      - name: Package portable ZIP and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path "artifacts/Studio/*" -DestinationPath "artifacts/Studio-win-x64.zip" -CompressionLevel Optimal -Force
          $hash = (Get-FileHash "artifacts/Studio/Studio.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Studio.exe" | Set-Content "artifacts/SHA256SUMS.txt" -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Studio.exe-win-x64
          path: |
            artifacts/Studio/Studio.exe
            artifacts/Studio-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Studio.exe ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/Studio/Studio.exe
            artifacts/Studio-win-x64.zip
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
